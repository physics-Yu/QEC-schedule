<svg xmlns="http://www.w3.org/2000/svg" width="1340" height="1535" viewBox="0 0 1340 1535" role="img" aria-labelledby="title desc">
<title id="title">Shor algorithm to atom actions — compilation flow</title>
<desc id="desc">Shor algorithm feeds Logical circuit. Zone architecture stays inside the physical compiler. Compute zone and Storage + entanglement zone merge into one arrow to Placement. A full-size AOD constraints module feeds Placement and Routing. Placement exchanges positions and route feedback with Routing. Atom action returns physical constraints to logical Constraint map and provides local actions for Entire atom action. Validation and runtime feedback follow the assembled program.</desc>

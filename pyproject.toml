[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neutral-atom-env"
version = "0.1.0"
description = "Deterministic neutral atom scheduling foundations"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "matplotlib>=3.8"]
smt = ["z3-solver>=4.12,<6"]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.setuptools.package-data]
"neutral_atom_experiments.testing" = ["*.html"]
"neutral_atom_env.visualization" = ["*.html", "*.js"]
"neutral_atom_app.visualization" = ["*.html", "*.js"]
"neutral_atom_strategies.motion" = ["*.js"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=artifacts/pytest-tmp"

[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "na-pipeline"
version = "0.1.0"
description = "Evidence-scoped neutral atom compilation and fake event pipeline"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
enola = ["networkx==3.5", "rustworkx==0.17.1", "numpy==2.3.5"]

[project.scripts]
na-pipeline = "na_pipeline.cli:main"

[tool.setuptools]
package-dir = {"na_pipeline" = "src/na_pipeline", "viewer" = "viewer"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["na_pipeline*", "viewer"]

[tool.setuptools.package-data]
viewer = ["*.html", "*.js", "*.css"]

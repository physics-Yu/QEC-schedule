[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "na-pipeline"
version = "0.1.0"
description = "Evidence-scoped neutral atom compilation and fake event pipeline"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
enola = ["networkx==3.5", "rustworkx==0.17.1", "numpy==2.3.5"]
dev = [
  "pytest>=8",
  "pytest-xdist>=3.6",
  "ruff>=0.14.1",
  "mypy>=1.11",
  "import-linter>=2.1",
  "pre-commit>=4.0",
]

[project.scripts]
na-pipeline = "na_pipeline.cli:main"

[tool.setuptools]
package-dir = {"na_pipeline" = "src/na_pipeline", "viewer" = "viewer"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["na_pipeline*", "viewer"]

[tool.setuptools.package-data]
viewer = ["*.html", "*.js", "*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
pythonpath = ["src", ".", "tests/runtime", "tests/backend", "tests/qec", "tests/validation"]
markers = [
  "requires_enola: requires the optional [enola] dependencies",
  "requires_artifacts: requires historical artifacts unavailable in a clean checkout",
  "slow: long-running regression or benchmark",
  "env_sensitive: depends on host process accounting or timing",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["src/na_pipeline", "scripts", "tests", "viewer", "third_party", "examples"]
force-exclude = true

<script>
(()=>{function make(ns,tag,attrs,...children){const n=ns?document.createElementNS(ns,tag):document.createElement(tag);for(const[k,v]of Object.entries(attrs||{})){if(v==null)continue;if(k==='text')n.textContent=v;else n.setAttribute(k,String(v))}for(const c of children.flat(Infinity)){if(c!=null)n.append(c instanceof Node?c:document.createTextNode(String(c)))}return n}

function bars(labels,series){const W=640,H=235,L=45,B=35,c=svg('svg',{viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':'基态概率对照'}),dw=(W-L-12)/labels.length;for(let j=0;j<=4;j++){const y=H-B-j*(H-B-15)/4;c.append(svg('line',{x1:L,x2:W-12,y1:y,y2:y,stroke:'#dce4ee'}),svg('text',{x:L-8,y:y+4,'text-anchor':'end','font-size':11,fill:'#526579'},j/4))}labels.forEach((l,i)=>{series.forEach((s,j)=>{const h=s.values[i]*(H-B-15);c.append(svg('rect',{x:L+i*dw+j*dw/(series.length+1)+5,y:H-B-h,width:dw/(series.length+1)-3,height:h,fill:`var(--series${j+1})`}))});c.append(svg('text',{x:L+(i+.5)*dw,y:H-13,'text-anchor':'middle','font-size':11,fill:'#526579'},l))});return el('div',{},el('p',{class:'muted'},series.map((s,i)=>`${i+1}: ${s.name}`).join(' · ')),c)}
function pauliCircuit(rotations,wires,indexOffset=0){
 const W=135+rotations.length*104,H=100+wires.length*44,c=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,role:'img','aria-label':'PPR 酉旋转线路，尚非 PBC 测量线路'}),y=w=>60+wires.indexOf(w)*44;
 wires.forEach(w=>c.append(svg('text',{x:8,y:y(w)+4,fill:'#20334a','font-size':12},w),svg('line',{x1:84,x2:W-8,y1:y(w),y2:y(w),stroke:'#b1becd'})));
 rotations.forEach((r,i)=>{const x=125+i*104,ys=r.observable.factors.map(([w])=>y(w));c.append(svg('text',{x,y:20,'text-anchor':'middle',fill:'#7c3aed','font-size':12},`R${indexOffset+i} · k=${r.quarter_turns}`),svg('text',{x,y:37,'text-anchor':'middle',fill:'#526579','font-size':11},`P sign ${r.observable.sign<0?'−':'+'}`));if(ys.length>1)c.append(svg('line',{x1:x,x2:x,y1:Math.min(...ys),y2:Math.max(...ys),stroke:'#7c3aed','stroke-width':3}));r.observable.factors.forEach(([w,b])=>c.append(svg('rect',{x:x-15,y:y(w)-14,width:30,height:28,rx:5,fill:'#eee8fb',stroke:'#7c3aed'}),svg('text',{x,y:y(w)+4,'text-anchor':'middle',fill:'#5e2aae','font-size':12},b)));c.append(svg('text',{x,y:H-15,'text-anchor':'middle',fill:'#526579','font-size':10},`源门 ${r.source_index}`))});
 return el('div',{class:'circuit-scroll'},c)
}
function injectionCircuit(contract,outcome,reference){
 const resource=contract.resource,entangler=contract.entangling_gates[0],measurement=contract.measurement,correction=contract.branches.find(b=>b.outcome===1).correction[0],W=900,H=reference?350:300,c=svg('svg',{viewBox:`0 0 ${W} ${H}`,width:W,height:H,role:'img','aria-label':`${contract.gate} 逻辑注入：外部 magic-state 输入、data 到 resource CX、资源 MZ、${measurement.id} 控制 ${correction.name}，physical 未实现`}),yd=92,yr=210;
 const text=(x,y,t,color='#20334a',size=13)=>c.append(svg('text',{x,y,fill:color,'font-size':size},t));
 const line=(x1,y1,x2,y2,attrs={})=>c.append(svg('line',{x1,y1,x2,y2,stroke:'#647b91','stroke-width':1.5,...attrs}));
 const gate=(x,y,name,active=true)=>{c.append(svg('rect',{x:x-27,y:y-20,width:54,height:40,rx:5,fill:active?'#eaf1fa':'#f3f6fa',stroke:active?'#2563eb':'#b1becd'}));text(x-20,y+5,name,active?'#195cad':'#526579',14)};
 text(12,22,'目标逻辑操作：'+contract.gate+'|ψ⟩；下图为独立理想合同，不是已生成的 surface-code physical circuit','#7c3aed',14);
 text(12,yd-14,contract.data_wire);text(12,yd+7,'|ψ⟩');line(90,yd,825,yd);text(830,yd+5,contract.gate+'|ψ⟩');
 c.append(svg('rect',{x:12,y:yr-38,width:245,height:70,rx:7,fill:'#fff6e7',stroke:'#c06712','stroke-dasharray':'5 3'}));text(22,yr-16,resource.wire+' = |'+resource.state+'⟩','#934b0b',14);text(22,yr+5,'外部理想资源输入 · 制备未实现','#934b0b',12);text(22,yr+23,'状态质量：'+resource.quality,'#934b0b',11);line(257,yr,505,yr);
 const yc={[contract.data_wire]:yd,[resource.wire]:yr},xc=352;line(xc,yc[entangler.wires[0]],xc,yc[entangler.wires[1]],{stroke:'#2563eb','stroke-width':2});c.append(svg('circle',{cx:xc,cy:yc[entangler.wires[0]],r:5,fill:'#2563eb'}),svg('circle',{cx:xc,cy:yc[entangler.wires[1]],r:13,fill:'white',stroke:'#2563eb','stroke-width':2}));text(xc-6,yc[entangler.wires[1]]+5,'+','#2563eb',19);text(xc-12,yd-23,'CX','#195cad',12);
 gate(505,yc[measurement.wire],'MZ');text(477,yr+48,measurement.id+' = '+outcome,'#934b0b',13);
 // Double wire is classical feedback. It is a diagram of the contract, not an executable native S pulse.
 const xs=697;for(const delta of[-2,2]){line(532,yr+delta,xs+delta,yr+delta,{stroke:'#c06712'});line(xs+delta,yr+delta,xs+delta,yd+23,{stroke:'#c06712'})}c.append(svg('polygon',{points:`${xs-6},${yd+31} ${xs+6},${yd+31} ${xs},${yd+22}`,fill:'#c06712'}));gate(xs,yd,correction.name,outcome===1);text(xs-52,yd-31,measurement.id+' = 1 时执行','#934b0b',12);text(563,yr+32,'资源已测量并消耗；双线为经典反馈','#934b0b',12);text(612,yd+46,outcome===1?'当前分支：应用 '+correction.name:'当前分支：跳过 '+correction.name,'#526579',12);
 if(reference){text(12,300,'reference');line(100,300,825,300);text(380,325,'与 data 纠缠，但不参与注入','#526579',12)}

<script>
(()=>{const d=JSON.parse(document.getElementById('experiment-data').textContent),{el,box,table,circuit,pauliCircuit,select,fmt,pauli,bars}=window.QECViz.helpers,E=d.experiments,content=document.getElementById('content');const names={overview:'总览',E1:'E1 · PPR 酉表示',E2:'E2 · 并行与硬件',E3:'E3 · 逻辑 CNOT / H',E4:'E4 · 理想 T 注入',E5:'E5 · 噪声与解码',E6:'E6 · 模幂编译'};document.getElementById('budget').textContent=`seed ${d.seed} · ${d.shots_per_noise_point.toLocaleString()} shots / 噪声点 · ${d.noise_scan_shots.toLocaleString()} 总采样`;
function overview(){content.append(el('p',{class:'scope'},'用户已拒绝此前交付。当前仅有组件参考实验：完整 PBC 测量线路、surface-code T 注入 physical circuit 及其 Executor 执行尚未实现。'),el('div',{class:'grid2'},...Object.entries(names).filter(([k])=>k!=='overview').map(([id,n])=>box(n,el('p',{},({E1:'比较完整酉矩阵、复振幅与相位，检查 signed Pauli 编译。',E2:'逐层检查 directed CNOT、全局 CZ 的 spectator 配对及 ancilla 容量。',E3:'查看九对 transversal CNOT、稳定子映射和 H 后编码朝向。',E4:'切换 T / Tdg、输入态及两个读出分支，检查条件修正。',E5:'扫描门与读出噪声，检查同一 shot 的 syndrome 和解码结果。',E6:'验证 1024 个指数与 exact Toffoli 分解，浏览模幂和 PPR。'})[id]),el('button',{type:'button',onclick:''},'打开实验 '+id)) )));content.querySelectorAll('.card button').forEach(b=>b.addEventListener('click',()=>render(b.textContent.slice(-2))));content.append(box('数据与科学图导出',el('div',{class:'downloads'},...['experiments.json','noise-scan.csv','modexp-truth.csv','noise-scan.svg','noise-scan.png','noise-scan.pdf'].map(f=>el('a',{href:f,download:f},f)))),box('阶段 A · 已验收的完整原子回放',el('p',{},'canonical d=3、三轮 X/Z memory。此处链接既有 Executor 执行证据，组件静态图不生成原子运动。'),el('div',{class:'downloads'},el('a',{href:'../qec-baseline-2026-10-03/memory-z-verified/index.html'},'Z memory 真实回放'),el('a',{href:'../qec-baseline-2026-10-03/memory-x-verified/index.html'},'X memory 真实回放'))),box('真实实现状态',table(['组件','已实现'],Object.entries(d.implementation_status).map(([k,v])=>[k,v?'是':'否']))),box('参考实验数值检查（不代表用户验收）',table(['检查','结果'],Object.entries(d.validation).map(([k,v])=>[k,fmt(v)]))),el('details',{},el('summary',{},'生成器源码 SHA-256'),table(['文件','SHA-256'],Object.entries(d.source_sha256))));}
function shor(){const e=E.E6,p=e.compiled_program;content.append(el('p',{class:'scope'},'N=21 的准备与模幂只编译到 PPR 酉表示；PBC 测量线路与物理 T 注入未实现。1024 个指数以独立经典 oracle 验证，Toffoli 另作相位敏感检查。'),box('编译资源',table(['阶段','规模'],[['输入算术门',e.input_gates.length],['Pauli rotations',p.rotations.length],['residual Clifford',p.residual_clifford.length],['指数验证',e.truth_table.filter(r=>r.passed).length+' / 1024']]),el('p',{class:'muted'},'T 数量表示资源消耗需求，不表示同时驻留的 magic-state 块数。')),box('Pauli support 分布',table(['support weight','rotations'],e.rotation_support_histogram.map(r=>[r.weight,r.count]))));
const result=el('div',{}),input=el('input',{type:'number',min:0,max:1023,value:0,'aria-label':'指数 e'});function truth(){const n=Number(input.value);if(!Number.isInteger(n)||n<0||n>1023){result.replaceChildren(el('p',{},'输入 0–1023 之间的整数'));return}const r=e.truth_table[n];result.replaceChildren(table(['e','电路输出','2^e mod 21','指数寄存器恢复','验证'],[[n,r.output,r.expected,r.exponent_restored,r.passed]]))}input.addEventListener('input',truth);truth();content.append(box('指数输入与 oracle 对照',el('label',{class:'control'},'指数 e（0–1023）',input),result));
let mode='input',page=0;const view=el('div',{}),pager=el('div',{});function draw(){const rows=mode==='input'?e.input_gates:mode==='clifford'?p.residual_clifford:p.rotations,total=Math.ceil(rows.length/24);page=Math.max(0,Math.min(page,total-1));const slice=rows.slice(page*24,(page+1)*24);view.replaceChildren(mode==='ppr'?el('div',{},pauliCircuit(slice,e.wire_order,page*24),table(['索引','源门索引','signed Pauli','k'],slice.map((r,i)=>[page*24+i,r.source_index,pauli(r.observable),r.quarter_turns]))):circuit(slice,e.wire_order));pager.replaceChildren(el('p',{class:'muted'},`第 ${page+1} / ${total} 页 · 全局索引 ${page*24} 起`));for(const [label,step]of[['上一页',-1],['下一页',1]]){const b=el('button',{},label);b.addEventListener('click',()=>{page+=step;draw()});pager.append(b)}}content.append(box('PPR 酉表示分页（PBC 测量／physical 展开未实现）',select('表示层',[{value:'input',label:'原始算术电路'},{value:'ppr',label:'signed Pauli rotations'},{value:'clifford',label:'residual Clifford'}],v=>{mode=v;page=0;draw()}),pager,view));draw();content.append(box('独立 exact Toffoli 验证',el('p',{},'完整 8×8 酉矩阵最大误差：'+fmt(e.toffoli.unitary_max_abs_error)),circuit(e.toffoli.expanded_gates,e.toffoli.wires),table(['输入','输出'],e.toffoli.truth_table.map(r=>[r.input,r.output]))),el('details',{},el('summary',{},'资源报告与源文件溯源'),el('pre',{style:'white-space:pre-wrap;overflow-wrap:anywhere'},JSON.stringify(e.resources,null,2))));}
function render(id){document.getElementById('title').textContent=names[id];document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-current',b.id==='nav-'+id));content.replaceChildren();if(id==='overview')overview();else if(id==='E1')window.QECQuantumPanels.renderE1(content,E.E1);else if(id==='E4')window.QECQuantumPanels.renderE4(content,E.E4);else if(id==='E2')window.QECBackendPanels.renderE2(content,E.E2);else if(id==='E3')window.QECBackendPanels.renderE3(content,E.E3);else if(id==='E5')window.QECNoisePanels.renderE5(content,E.E5);else shor()}

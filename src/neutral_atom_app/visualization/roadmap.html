<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QEC · 四阶段验收记录</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f8;color:#263c3c;font:15px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}main{max-width:1100px;margin:38px auto;padding:0 24px}h1{font-size:30px;letter-spacing:-1px;margin:8px 0}h2{font-size:20px;margin:0}h3{font-size:15px;margin:16px 0 5px}.eyebrow{font-size:11px;letter-spacing:2px;color:#547870}.muted{color:#607779}header{display:flex;align-items:center;justify-content:space-between;gap:20px}.notice{border-left:3px solid #cf9356;background:#fff8ed;padding:14px 18px;margin:22px 0}.stages{display:grid;gap:18px}.stage{background:#fff;border:1px solid #dce4e5;border-radius:12px;padding:22px}.stage-head{display:flex;justify-content:space-between;gap:15px;align-items:start}.tag{padding:3px 12px;border-radius:30px;font-size:13px;background:#edf1f3;white-space:nowrap}.tag.passed{background:#e4f3e9;color:#1e704a}.tag.failed,.tag.awaiting_approval{background:#fbe8e5;color:#9b362d}.tag.running{background:#e7eef9;color:#365c95}button{padding:8px 13px;border:1px solid #bccbc9;border-radius:7px;background:white;color:inherit;cursor:pointer;font:inherit}button:hover{background:#eef4f3}button:focus-visible{outline:3px solid #76b6ac}details{margin-top:13px}summary{cursor:pointer}ul{margin:4px 0 10px;padding-left:22px}code{overflow-wrap:anywhere;font-size:12px}.error{background:#fce8e5;color:#923930;padding:15px;border-radius:8px;margin:16px 0}.hidden,[hidden]{display:none!important}.attempt{padding:12px 0;border-top:1px solid #e5ebec}.dialog-backdrop{position:fixed;inset:0;background:#13272580;display:flex;align-items:center;justify-content:center;padding:20px;z-index:10}.dialog{max-width:760px;max-height:90vh;overflow:auto;background:#fff;border:1px solid #e0b2a9;border-radius:14px;padding:25px;box-shadow:0 20px 80px #13272545}.dialog-head{display:flex;justify-content:space-between;align-items:start;gap:20px}.facts{border-left:3px solid #c34c3c;padding-left:14px}.hypotheses{border-left:3px solid #b59a62;padding-left:14px}.approval{font-weight:600;padding:12px;background:#fff3df}.small{font-size:13px}@media(max-width:650px){header,.stage-head{align-items:start;flex-direction:column}main{padding:0 16px;margin-top:20px}}
</style>
<main><header><div><div class="eyebrow">QEC / ACCEPTANCE LEDGER</div><h1>四阶段，逐步验收。</h1><p class="muted">每次正式尝试保留记录。只有已通过且有证据的阶段才标为通过。</p></div><button id="refresh">刷新记录</button></header>
<div class="notice">测试、界面及常规工程问题自行修复并保留验收记录。物理模型可能出错、物理约束或整体架构需要调整时，暂停相关方向并请求用户审批。此页面只读，不会发起实验、批准或重试。</div>
<p id="updated" class="muted small">正在读取 status.json…</p><div id="error" class="error" role="alert" hidden></div><section id="stages" class="stages" aria-label="四阶段验收状态"></section>
</main>
<div id="failure-dialog" class="dialog-backdrop" role="dialog" aria-modal="true" aria-labelledby="failure-title" hidden><div class="dialog"><div class="dialog-head"><div><span class="tag failed">正式验收失败</span><h2 id="failure-title"></h2></div><button id="failure-close" aria-label="关闭失败报告">关闭</button></div><p id="failure-attempt" class="muted"></p><div id="failure-body"></div><p class="small muted">关闭窗口仅隐藏报告，不代表批准；失败记录仍保留。需要在对话中取得用户明确审批后，由执行流程记录审批和下一次尝试。</p></div></div>
<script src="roadmap.js"></script></html>

name: Python tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[visualization]"
      - run: python -m unittest discover -s tests -v
        env:
          PYTHONPATH: src
      - run: python examples/demo_code_topology.py
      - run: python examples/demo_syndrome_circuit.py
      - run: python examples/demo_physical_dag.py
      - run: python examples/demo_physical_dag.py --primitive CNOT --rounds 3 --output-dir results/dag_cnot
      - run: python examples/demo_hardware_layout.py
      - run: python examples/demo_gate_lowering.py
      - run: python examples/demo_gate_lowering.py --primitive CNOT --rounds 3 --output-dir results/lowering_cnot
      - run: python examples/demo_aod_movement.py
      - run: python examples/demo_aod_movement.py --rounds 3 --output-dir results/aod_three_rounds
      - uses: actions/upload-artifact@v4
        with:
          name: hardware-layout-python-${{ matrix.python-version }}
          path: |
            results/hardware_layout.png
            results/hardware_state.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-requests-python-${{ matrix.python-version }}
          path: |
            results/experimental_requests.json
            results/lowering_cnot/experimental_requests.json
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: aod-epochs-python-${{ matrix.python-version }}
          path: |
            results/aod_epochs.json
            results/aod_three_rounds/aod_epochs.json
          if-no-files-found: error

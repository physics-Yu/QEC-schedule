name: Physical compiler CI

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  physical-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install physical compiler and test runner
        run: python -m pip install -e ./modules/physical_compiler 'pytest>=8.3,<10'
      - name: Physical compiler fast tests
        run: python -m pytest -c pytest.ini modules/physical_compiler/tests --test-tier fast -q
      - name: Compile, validate and export a small example
        run: |
          nadit compile modules/physical_compiler/examples/jobs/pair.json --validate -o "$RUNNER_TEMP/pair-result.json"
          nadit view "$RUNNER_TEMP/pair-result.json" -o "$RUNNER_TEMP/pair-viewer.html"

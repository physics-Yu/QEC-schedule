# Optional comparison profile.  The logical program and physical DAG stay
# identical to ghz4_rich.yaml; only runtime feasibility is made restrictive.
schema_version: 2
devices:
  device/aod: 1
  device/local_1q: 1
  device/rydberg: 1
  device/imaging: 1
  device/state_preparation: 1
units: {length: um, time: us}
min_atom_separation: 1.0
reservoir_atoms: 4
aod:
  # Keep transport geometrically feasible; this profile limits interaction
  # and imaging batches, while the rich profile leaves all logical requests
  # to the dynamic planner in one batch.
  max_x_tones: 128
  max_y_tones: 128
  allowed_region: [0, 0, 120, 125]
  axis_execution: simultaneous
  min_tone_spacing: null
  max_speed_x: 2.0
  max_speed_y: 2.0
  ordering_rule: none
  allowed_primitives: [TRANSLATE]
  displacement_tolerance: 1.0e-9
entanglement:
  bounds: [0, 52, 120, 85]
  interaction_lanes: [58, 68, 78]
  preferred_axis: x
  pair_distance: 2.0
  pair_distance_tolerance: 0.01
  inter_pair_guard_distance: 1.0
  min_atom_spacing: 1.0
  max_parallel_pairs: 8
  max_atoms: 16
measurement:
  bounds: [0, 90, 120, 125]
  imaging_bounds: [2, 92, 118, 123]
  min_atom_spacing: 2.0
  max_parallel_atoms: 8
  field_of_view: [2, 92, 118, 123]
timing:
  move_speed: 2.0
  pickup_duration: 0.5
  dropoff_duration: 0.5
  single_qubit_duration: 0.5
  entangle_duration: 1.0
  measurement_duration: 4.0
  prepare_duration: 0.5
  reset_duration: 0.5
zones:
  - id: memory_l0
    kind: STORAGE
    bounds: [0, 0, 26, 21]
    capacity: 17
    allowed_operations: [PREPARE, RESET, LOCAL_1Q]
    sites:

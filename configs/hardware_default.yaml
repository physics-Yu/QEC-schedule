# Linear experimental layout: Memory -> Entanglement -> Measurement (downward).
# Reservoir sits to the right of Memory. Laser beams run in straight lines
# parallel to the experimental platform; lengths remain illustrative.
# All capacity values count ATOMS. Four entangling pair slots hold eight atoms.
schema_version: 1
units: {length: um, time: us}
min_atom_separation: 1.0
reservoir_atoms: 4
# Step-5 estimates only. The scheduler will assign start times later.
timing:
  move_speed: 1.0  # um/us
  pickup_duration: 1.0
  dropoff_duration: 1.0
  single_qubit_duration: 1.0
  entangle_duration: 1.0
  measurement_duration: 20.0
  prepare_duration: 1.0
  reset_duration: 1.0
zones:
  - id: storage
    kind: STORAGE
    bounds: [0, 0, 45, 45]
    capacity: 17
    allowed_operations: [PREPARE, RESET, LOCAL_1Q]
    # Automatic mapping fills sites in order: data qubits, then syndrome ancillas.
    sites:
      - {id: s0, position: [10, 12]}
      - {id: s1, position: [20, 12]}
      - {id: s2, position: [30, 12]}
      - {id: s3, position: [10, 22]}
      - {id: s4, position: [20, 22]}
      - {id: s5, position: [30, 22]}
      - {id: s6, position: [10, 32]}
      - {id: s7, position: [20, 32]}
      - {id: s8, position: [30, 32]}
      - {id: s9, position: [15, 17]}
      - {id: s10, position: [25, 27]}
      - {id: s11, position: [25, 7]}
      - {id: s12, position: [15, 37]}
      - {id: s13, position: [25, 17]}
      - {id: s14, position: [15, 27]}
      - {id: s15, position: [5, 17]}
      - {id: s16, position: [35, 27]}
  - id: measurement
    kind: MEASUREMENT
    bounds: [0, 84, 45, 99]
    capacity: 8
    allowed_operations: [MEASURE, RESET]
    sites:
      - {id: m0, position: [5, 92]}
      - {id: m1, position: [10, 92]}
      - {id: m2, position: [15, 92]}
      - {id: m3, position: [20, 92]}
      - {id: m4, position: [25, 92]}
      - {id: m5, position: [30, 92]}
      - {id: m6, position: [35, 92]}
      - {id: m7, position: [40, 92]}
  - id: entangling
    kind: ENTANGLING
    bounds: [0, 52, 45, 77]
    capacity: 8
    allowed_operations: [ENTANGLE, LOCAL_1Q]
    sites:
      - {id: e0a, position: [10, 61]}
      - {id: e0b, position: [14, 61]}
      - {id: e1a, position: [30, 61]}
      - {id: e1b, position: [34, 61]}
      - {id: e2a, position: [10, 71]}
      - {id: e2b, position: [14, 71]}
      - {id: e3a, position: [30, 71]}
      - {id: e3b, position: [34, 71]}
    pair_slots:
      - {id: p0, sites: [e0a, e0b]}
      - {id: p1, sites: [e1a, e1b]}
      - {id: p2, sites: [e2a, e2b]}
      - {id: p3, sites: [e3a, e3b]}
  - id: reservoir
    kind: RESERVOIR
    bounds: [55, 0, 100, 45]
    capacity: 6
    allowed_operations: [REFILL, PREPARE]
    sites:
      - {id: r0, position: [62, 22]}
      - {id: r1, position: [68, 22]}
      - {id: r2, position: [74, 22]}
      - {id: r3, position: [80, 22]}
      - {id: r4, position: [86, 22]}
      - {id: r5, position: [92, 22]}
